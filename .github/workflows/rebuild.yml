name: Rebuild repository
on: 
  workflow_dispatch:
     inputs:
      VERSION:
        description: 'Version of the new release'
        required: true
      DOWNLOAD_SHA256:
        description: 'SHA256 sum of the zip file'
        required: true
      DOWNLOAD_SIZE:
        description: 'Size of the zip file'
        required: true
      DOWNLOAD_URL:
        description: 'URL of the zip file'
        required: true
      INSTALL_SIZE:
        description: 'Size of the extracted zip file'
        required: true
      KICAD_VERSION:
        description: 'Oldest KiCad version the release supports, empty if not given'
        required: false
        default: ''
      KICAD_VERSION_MAX:
        description: 'Newest KiCad version the release supports, empty for no limit'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Regenerate josn files
        env:
          VERSION: ${{ github.event.inputs.VERSION }}
          DOWNLOAD_SHA256: ${{ github.event.inputs.DOWNLOAD_SHA256 }}
          DOWNLOAD_SIZE: ${{ github.event.inputs.DOWNLOAD_SIZE }}
          DOWNLOAD_URL: ${{ github.event.inputs.DOWNLOAD_URL }}
          INSTALL_SIZE: ${{ github.event.inputs.INSTALL_SIZE }}
          KICAD_VERSION: ${{ github.event.inputs.KICAD_VERSION }}
          KICAD_VERSION_MAX: ${{ github.event.inputs.KICAD_VERSION_MAX }}
        run: python generate.py "$VERSION" "$DOWNLOAD_SHA256" "$DOWNLOAD_SIZE" "$DOWNLOAD_URL" "$INSTALL_SIZE" "$KICAD_VERSION" "$KICAD_VERSION_MAX"
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: actions@github.com
          message: 'Update Addon repository after new release'
          add: '*.json'
